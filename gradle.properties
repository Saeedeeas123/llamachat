# Toolchain settings verified on this device. The aapt2 override is mandatory: AGP would
# otherwise pull an x86_64 aapt2 from Maven, which cannot execute on this ARM64 machine.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/root/Android/build-tools/35.0.1/aapt2
android.aapt2DaemonMode=in-process
android.aapt2.process.daemon=false
android.suppressUnsupportedCompileSdk=35